server:
  port: 8093

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/demodb
    username: demo
    password: demo123
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  upload:
    dir: ./uploads

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.example.enumapp: INFO
