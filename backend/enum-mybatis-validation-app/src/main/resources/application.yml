server:
  port: 8093

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/demodb
    username: demo
    password: demo123
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  cache:
    type: caffeine
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  upload:
    dir: ./uploads

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.example.enumapp: INFO
    com.example.enumapp.domain.order.OrderQueryService: INFO
    com.example.enumapp.config.MybatisSqlLoggingInterceptor: INFO
