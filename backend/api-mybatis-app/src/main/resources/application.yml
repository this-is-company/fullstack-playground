server:
  port: 8130

spring:
  profiles:
    active: local
  datasource:
    url: jdbc:h2:mem:apimybatis;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  h2:
    console:
      enabled: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # example JSON 대신 필드/타입/설명 모델(표에 가까운 뷰)
    default-model-rendering: example
    default-model-expand-depth: 2
    default-models-expand-depth: 10
    doc-expansion: list
    try-it-out-enabled: true
    display-request-duration: true
    filter: true
    tags-sorter: alpha
    operations-sorter: method
    show-common-extensions: true
  api-docs:
    path: /v3/api-docs
  writer-with-order-by-keys: false

logging:
  level:
    com.example.demo: INFO
