server:
  port: 8102

spring:
  application:
    name: order-api
  profiles:
    active: local
  datasource:
    url: jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

catalog:
  base-url: http://localhost:8101

shop:
  jwt:
    secret: shop-demo-secret-change-me-32bytes!!

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
